        run: |
          set -euo pipefail
          WORK="$USERPROFILE/arb install/work"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          uv venv --python 3.12 "$WORK/venv"
          uv pip install --python "$WORK/venv/Scripts/python.exe" \
            wheels-native/*.whl wheels-tui/*.whl
          uv pip install --python "$WORK/venv/Scripts/python.exe" \
            pytest pandas pyarrow
          "$WORK/venv/Scripts/python.exe" -c "import pytauargus; print('installed ok')"

      - name: Read expectations from the build manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          m = json.load(open(
              "wheels-native/manifest-pytauargus-windows-py3.12.json"))
          t = json.load(open("wheels-tui/manifest-pytauargus-tui-wheel.json"))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"TAUARGUS_EXPECTED_ENGINE_SHA={m['engine_sha']}\n")
              f.write(f"TAUARGUS_EXPECTED_HIGHS={m['highs_version']}\n")
              f.write(f"TAUARGUS_EXPECTED_VERSION={m['version']}\n")
              f.write(f"TAUARGUS_EXPECTED_TUI_VERSION={t['version']}\n")
              f.write(f"TAUARGUS_TEST_VENV={os.environ['USERPROFILE']}/arb install/work/venv\n")
          PY

      - name: Run the installed-package tests
        shell: bash
        run: |
          set -euo pipefail
          WORK="$USERPROFILE/arb install/work"
          cd install-tests
          "$WORK/venv/Scripts/python.exe" -m pytest . -q -rs

      - name: Verify the loaded DLLs come from the installation
        shell: bash
        run: |
          set -euo pipefail
          WORK="$USERPROFILE/arb install/work"
          "$WORK/venv/Scripts/python.exe" - <<'PY'
          import ctypes, sysconfig
          from ctypes import wintypes

          kernel32 = ctypes.WinDLL("kernel32", use_last_error=True)
          psapi = ctypes.WinDLL("psapi")
          kernel32.GetCurrentProcess.restype = wintypes.HANDLE
          kernel32.GetModuleFileNameExW.restype = wintypes.DWORD
          kernel32.GetModuleFileNameExW.argtypes = [
              wintypes.HANDLE, wintypes.HMODULE, wintypes.LPWSTR, wintypes.DWORD]
          psapi.EnumProcessModulesEx.restype = wintypes.BOOL
          psapi.EnumProcessModulesEx.argtypes = [
              wintypes.HANDLE, ctypes.POINTER(wintypes.HMODULE),
              wintypes.DWORD, ctypes.POINTER(wintypes.DWORD), wintypes.DWORD]

          hprocess = kernel32.GetCurrentProcess()
          arrays = (wintypes.HMODULE * 4096)()
          needed = wintypes.DWORD()
          # LIST_MODULES_ALL: include modules of all thread stacks.
          if not psapi.EnumProcessModulesEx(
                  hprocess, ctypes.byref(arrays), ctypes.sizeof(arrays),
                  ctypes.byref(needed), 0x03):
              raise OSError("EnumProcessModulesEx failed")
          loaded = []
          for h in arrays:
              if not h:
                  break
              buf = ctypes.create_unicode_buffer(4096)
              kernel32.GetModuleFileNameExW(hprocess, h, buf, 4096)
              loaded.append(buf.value.lower())
          site = sysconfig.get_paths()["purelib"].lower()
          dlls = [l for l in loaded
                  if l.endswith(".dll")
                  and any(t in l for t in ("highs", "tauargus", "crp"))]
          print("product DLLs loaded:")
          for d in dlls:
              print(" ", d)
          assert dlls, "no product DLLs are loaded after import"
          for d in dlls:
              assert d.startswith(site), (
                  f"product DLL loaded from outside the installation: {d}")
          import pytauargus._tauargus as native
          assert native.__file__.lower().startswith(site), (
              f"native extension outside the installation: {native.__file__}")
          print("all product DLLs load from the installation")
          PY

      - name: Test the uvx entry point (local wheels only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uvwheels
          cp wheels-native/*.whl wheels-tui/*.whl uvwheels/
          uvx --find-links uvwheels \
            --from "pytauargus-tui==${TAUARGUS_EXPECTED_TUI_VERSION}" \
            pytauargus-tui --help

  release:
    name: Publish release
    needs: [build-macos, build-linux, build-windows, build-tui,
            install-linux-x86_64, install-linux-aarch64,
            install-macos-arm64, install-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      # No checkout: this job must publish exactly the artifacts that the
      # install tests consumed, and a checkout (clean: true) would delete
      # the downloaded files. All provenance comes from the build
      # manifests.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # PyPI versions are immutable: refuse to publish if the tag and the
      # package versions disagree. The TUI is released in lockstep with
      # pytauargus, so all three must agree.
      - name: Verify the build manifests and tag
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, sys
          dist = pathlib.Path("dist")
          manifests = sorted(dist.glob("**/manifest-*.json"))
          if not manifests:
              sys.exit("no build manifests found")
          entries = [json.loads(m.read_text()) for m in manifests]
          py_manifests = [e for e in entries if e["product"] == "pytauargus"]
          tui_manifests = [e for e in entries if e["product"] == "pytauargus-tui"]
          if not py_manifests or not tui_manifests:
              sys.exit("missing pytauargus or pytauargus-tui manifests")
          versions = {e["version"] for e in entries}
          if len(versions) != 1:
              sys.exit(f"version mismatch across artifacts: {versions}")
          version = versions.pop()
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("py-v")
          if tag != version:
              sys.exit(f"tag py-v{tag} does not match package version {version}")
          engine_shas = {e["engine_sha"] for e in py_manifests if e["engine_sha"]}
          if len(engine_shas) != 1:
              sys.exit(f"engine sha mismatch across wheels: {engine_shas}")
          highses = {e["highs_version"] for e in py_manifests if e["highs_version"]}
          if len(highses) != 1:
              sys.exit(f"highs version mismatch across wheels: {highses}")
          # Verify every listed file exists, is nonempty, and matches.
          for e in entries:
              for f in e["files"]:
                  p = dist / f["name"]
                  if not p.exists():
                      sys.exit(f"missing release file: {p}")
                  data = p.read_bytes()
                  if not data:
                      sys.exit(f"empty release file: {p}")
                  actual = hashlib.sha256(data).hexdigest()
                  if actual != f["sha256"]:
                      sys.exit(f"sha256 mismatch for {p}: "
                               f"{actual} != {f['sha256']}")
          # Required platform coverage: every supported CPython on every
          # target platform (the tag run always builds the full matrix).
          def cptag(name):
              # Wheel name: <dist>-<version>-cp<3 digits>-cp<3 digits>-<plat>.whl
              m = re.search(r"-cp(\d{3})-cp", name)
              return m.group(1) if m else None
          have = {(e["platform"], cptag(e["files"][0]["name"]))
                  for e in py_manifests}
          required = {(plat, cp)
                      for plat in ("manylinux_2_28_x86_64",
                                   "manylinux_2_28_aarch64",
                                   "macosx_arm64", "win_amd64")
                      for cp in ("310", "311", "312", "313", "314", "315")}
          missing = sorted(required - have)
          if missing:
              sys.exit(f"missing required wheels: {missing}")
          aggregated = {
              "version": version,
              "product_commit": entries[0]["product_commit"],
              "engine_sha": engine_shas.pop(),
              "highs_version": highses.pop(),
              "artifacts": entries,
          }
          (dist / "release-manifest.json").write_text(
              json.dumps(aggregated, indent=2) + "\n")
          print(json.dumps(aggregated, indent=2))
          PY

      - name: Show wheels
        run: ls -la dist

      # Downloadable wheels on the GitHub Release page, plus the
      # machine-readable manifest the hashes were verified against.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.whl
            dist/release-manifest.json
          generate_release_notes: true

      # twine uploads one project per session, so the TUI wheel (a distinct
      # PyPI project) is separated from the pytauargus wheels first.
      - name: Separate TUI wheel
        run: |
          set -euo pipefail
          mkdir -p dist-tui
          mv dist/pytauargus_tui-*.whl dist-tui/
          ls -la dist dist-tui

      # Optional PyPI publish (trusted publishing or token).
      - name: Publish pytauargus to PyPI
        if: ${{ vars.PYPI_ENABLED == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish pytauargus-tui to PyPI
        if: ${{ vars.PYPI_ENABLED == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-tui
