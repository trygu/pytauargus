# Build self-contained cross-platform wheels for pytauargus and publish
# them as GitHub Release assets (and, on tag, optionally to PyPI).
#
# Why a manual matrix instead of cibuildwheel: the Python build links
# against a pre-built engine. The engine and the _tauargus extension it
# feeds come from the tauargus-engine submodule (the gitlink in this repo is
# the engine pin; the checkout places it at ./tauargus-engine). cibuildwheel
# copies only the package dir into its container and would not see it.
#
# Each build job:
#   1. checks out the pinned tauargus-engine (submodules recursive),
#   2. builds HiGHS from source (version-pinned, cached),
#   3. builds the tauargus engine superbuild (cached),
#   4. builds the pytauargus wheel for one CPython via `pip wheel`,
#   5. repairs the wheel so HiGHS + engine libs are bundled
#      (delocate / auditwheel / delvewheel) -> self-contained wheel,
#   6. uploads it as an artifact.
#
# The release job (on tag) aggregates the artifacts into a GitHub Release
# and, if PyPI publishing is enabled, publishes there too.

name: wheels

on:
  workflow_dispatch:
  push:
    tags: ["py-v*"]
  # PRs get the full build + installed-artifact test report; publishing
  # stays gated on the py-v* tag (the release job's `if`).
  pull_request:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

# The HiGHS version is not set here: each build job reads it from the pinned
# engine checkout (engine/HiGHS-VERSION), the single source of truth shared
# with the R package build.

# ---------------------------------------------------------------------------
# Shared build recipe, inlined per job (GitHub Actions has no job-level
# function inclusion). Keep the three copies in sync.
# ---------------------------------------------------------------------------

jobs:
  build-macos:
    name: macos-arm64 py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
        # The PR report builds one CPython per platform (3.12); tag runs
        # build the full supported matrix.
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The engine pin is the submodule gitlink in this repo; the checkout
      # above places it at ./tauargus-engine (nested submodules included).
      - name: Read engine pin
        shell: bash
        run: echo "ENGINE_REV=$(git -C tauargus-engine rev-parse HEAD)" >> "$GITHUB_ENV"

      # The HiGHS version is pinned in the engine repo (engine/HiGHS-VERSION),
      # the single source of truth for both the Python and the R builds.
      - name: Read HiGHS pin
        shell: bash
        run: echo "HIGHS_TAG=$(tr -d '[:space:]' < tauargus-engine/engine/HiGHS-VERSION)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build HiGHS from source (cached)
        id: highs
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/highs-prefix"
          if [ -f "$PREFIX/.done" ]; then
            echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone --depth 1 --branch "$HIGHS_TAG" \
            https://github.com/ERGO-Code/HiGHS.git highs
          cmake -S highs -B highs/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build highs/build -j
          cmake --install highs/build
          touch "$PREFIX/.done"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Build engine superbuild (cached)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "tauargus-engine/engine/build/.done" ]; then
            echo "engine already built"
            exit 0
          fi
          cmake -S tauargus-engine/engine -B tauargus-engine/engine/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DHighs_DIR="${{ steps.highs.outputs.prefix }}/lib/cmake/Highs"
          cmake --build tauargus-engine/engine/build -j
          touch tauargus-engine/engine/build/.done

      - name: Build wheel
        shell: bash
        env:
          TAUARGUS_ENGINE_DIR: ${{ github.workspace }}/tauargus-engine
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "scikit-build-core>=0.10" "pybind11>=2.13"
          python -m pip wheel . --no-deps -w wheelhouse

      - name: Repair wheel (bundle HiGHS + engine libs)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install delocate
          delocate-listdeps wheelhouse/*.whl || true
          delocate-wheel -w repaired wheelhouse/*.whl

      - name: Write artifact manifest
        shell: bash
        env:
          MANIFEST_ARTIFACT: pytauargus-macos-arm64-py${{ matrix.python }}
          MANIFEST_PRODUCT: pytauargus
          MANIFEST_PLATFORM: macosx_arm64
          MANIFEST_PYTHON: py${{ matrix.python }}
          MANIFEST_WHEEL_DIR: repaired
          MANIFEST_PYPROJECT: pyproject.toml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tomllib
          wheel_dir = pathlib.Path(os.environ["MANIFEST_WHEEL_DIR"])
          version = tomllib.load(
              open(os.environ.get("MANIFEST_PYPROJECT", "pyproject.toml"), "rb"),
          )["project"]["version"]
          files = []
          for p in sorted(wheel_dir.glob("*.whl")):
              data = p.read_bytes()
              if not data:
                  raise SystemExit(f"empty wheel: {p}")
              files.append({"name": p.name,
                            "sha256": hashlib.sha256(data).hexdigest(),
                            "size": len(data)})
          if not files:
              raise SystemExit("no wheels to manifest")
          manifest = {
              "artifact": os.environ["MANIFEST_ARTIFACT"],
              "product": os.environ["MANIFEST_PRODUCT"],
              "version": version,
              "product_commit": os.environ["GITHUB_SHA"],
              "engine_sha": os.environ["ENGINE_REV"],
              "highs_version": os.environ["HIGHS_TAG"],
              "platform": os.environ["MANIFEST_PLATFORM"],
              "python": os.environ["MANIFEST_PYTHON"],
              "files": files,
          }
          out = wheel_dir / f"manifest-{manifest['artifact']}.json"
          out.write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pytauargus-macos-arm64-py${{ matrix.python }}
          path: repaired
          if-no-files-found: error

  build-linux:
    name: manylinux2028 ${{ matrix.arch }} py${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}:latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'pull_request' && fromJSON('["cp312-cp312"]') || fromJSON('["cp310-cp310", "cp311-cp311", "cp312-cp312", "cp313-cp313", "cp314-cp314", "cp315-cp315"]') }}
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The engine pin is the submodule gitlink in this repo; the checkout
      # above places it at ./tauargus-engine (nested submodules included).
      - name: Read engine pin
        shell: bash
        run: echo "ENGINE_REV=$(git -C tauargus-engine rev-parse HEAD)" >> "$GITHUB_ENV"

      # The HiGHS version is pinned in the engine repo (engine/HiGHS-VERSION),
      # the single source of truth for both the Python and the R builds.
      - name: Read HiGHS pin
        shell: bash
        run: echo "HIGHS_TAG=$(tr -d '[:space:]' < tauargus-engine/engine/HiGHS-VERSION)" >> "$GITHUB_ENV"

      - name: Toolchain (cmake/ninja/auditwheel)
        run: /opt/python/${{ matrix.python }}/bin/pip install cmake ninja "auditwheel>=6" "scikit-build-core>=0.10" "pybind11>=2.13"

      - name: Build HiGHS from source
        id: highs
        run: |
          set -euo pipefail
          PREFIX="$GITHUB_WORKSPACE/highs-prefix"
          git clone --depth 1 --branch "$HIGHS_TAG" \
            https://github.com/ERGO-Code/HiGHS.git highs
          # Version script: export only the HiGHS C API. Without it,
          # HiGHS's own template instantiations (std::string, std::vector
          # members) are exported as strong symbols, and a second C++
          # runtime in the same process (pyarrow's dynamic libstdc++)
          # would bind to them and corrupt the heap.
          printf '{ global: Highs_*; local: *; };\n' \
            > "$GITHUB_WORKSPACE/highs/highs-export.vers"
          # No CLI or examples: they link the HiGHS C++ API, which the
          # version script keeps local (the engine uses the C API only).
          cmake -S highs -B highs/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_CXX_EXE=OFF \
            -DBUILD_SHARED_EXTRAS_LIB=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc -Wl,--exclude-libs,libstdc++.a -Wl,--exclude-libs,libsupc++.a -Wl,--exclude-libs,libgcc.a -Wl,--exclude-libs,libgcc_eh.a -Wl,--version-script=$GITHUB_WORKSPACE/highs/highs-export.vers"
          cmake --build highs/build -j
          cmake --install highs/build
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Build engine superbuild
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tauargus-engine/engine -B tauargus-engine/engine/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DHighs_DIR="$(dirname "$(find "${{ steps.highs.outputs.prefix }}" -name "[Hh]ighs[Cc]onfig.cmake" -o -name highs-config.cmake | head -n1)")"
          cmake --build tauargus-engine/engine/build -j

      # The engine libs carry the absolute build-tree RUNPATH. auditwheel
      # resolves such entries against the build host and grafts a
      # hashed-soname duplicate of the lib into pytauargus.libs, while the
      # extension (RPATH $ORIGIN) keeps loading the root copy, so each
      # engine lib would load twice, with two embedded static C++
      # runtimes, and the interpreter would abort at exit. Normalize the
      # RUNPATH to $ORIGIN (the sibling engine libs, all installed next
      # to the extension) plus the HiGHS prefix, so only libhighs is
      # grafted, exactly once.
      - name: Normalize engine lib RUNPATH for the wheel
        shell: bash
        run: |
          set -euo pipefail
          HIGHS_LIBDIR="$(dirname "$(find "${{ steps.highs.outputs.prefix }}" -name 'libhighs.so.1*' -type f | head -n1)")"
          for lib in tauargus-engine/engine/build/lib/libtauargus_csp.so \
                     tauargus-engine/engine/build/lib/libtauargus_hitas.so \
                     tauargus-engine/engine/build/lib/libtauargus_rounder.so \
                     tauargus-engine/engine/build/lib/libCRP.so; do
            patchelf --set-rpath "\$ORIGIN:${HIGHS_LIBDIR}" "$lib"
          done

      - name: Build wheel
        env:
          TAUARGUS_ENGINE_DIR: ${{ github.workspace }}/tauargus-engine
        run: |
          set -euo pipefail
          /opt/python/${{ matrix.python }}/bin/pip wheel \
            . --no-deps -w wheelhouse

      - name: Repair wheel (bundle HiGHS)
        shell: bash
        run: |
          set -euo pipefail
          auditwheel repair wheelhouse/*.whl -w repaired

      # The wheel must carry no dependency on the host C++ runtime: the
      # extension, the engine libs and the bundled HiGHS all statically
      # link it. Fail if any bundled library still references it (0.5.5
      # missed this for the R binaries; the 0.5.5 wheel's bundled
      # libhighs needed the host libstdc++).
      - name: Verify no host C++ runtime dependency
        shell: bash
        run: |
          set -eu
          TMP="$(mktemp -d)"
          /opt/python/${{ matrix.python }}/bin/python -m zipfile -e repaired/*.whl "$TMP"
          # A library that dynamically depends on the host C++ runtime
          # carries the DT_NEEDED strings in its dynamic section; none of
          # our bundled libraries may contain them.
          bad=""
          for f in $(find "$TMP" -name "*.so*" -type f); do
            if grep -q "libstdc++\.so\.6" "$f" || grep -q "libgcc_s\.so\.1" "$f"; then
              bad="$bad $f"
            fi
          done
          if [ -n "$bad" ]; then
            echo "host C++ runtime dependency in:$bad" >&2
            exit 1
          fi
          # The embedded static runtime must not leak into the global
          # symbol table either: an exported static runtime collides with
          # the dynamic libstdc++ of another extension in the same
          # process (observed as free(): invalid pointer with pyarrow).
          command -v readelf >/dev/null || { echo "readelf not found" >&2; exit 1; }
          for f in $(find "$TMP" -name "*.so*" -type f); do
            n=$(readelf --dyn-syms "$f" 2>/dev/null \
              | awk '$5=="GLOBAL" && $7!="UND" && $8 ~ /^(_ZSt|_ZNSt|__cxa|_Znw|_Zdl)/' \
              | wc -l)
            if [ "$n" -gt 0 ]; then
              echo "exported C++ runtime symbols in $f: $n" >&2
              exit 1
            fi
          done
          # The repaired wheel must carry at most one module per engine
          # library. auditwheel grafts a duplicate (hashed soname) when an
          # rpath entry resolves outside the wheel; two modules of the
          # same lib carry two embedded runtimes and abort the interpreter
          # at exit (observed in the 0.5.6 tui smoke test).
          dups=$(for f in $(find "$TMP" -name "*.so*" -type f); do
                   readelf -n "$f" 2>/dev/null | awk '/Build ID/{print $3}'
                 done | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "duplicate library build ids in the wheel:" >&2
            echo "$dups" >&2
            exit 1
          fi

      - name: Write artifact manifest
        env:
          MANIFEST_ARTIFACT: pytauargus-manylinux-${{ matrix.arch }}-py${{ matrix.python }}
          MANIFEST_PRODUCT: pytauargus
          MANIFEST_PLATFORM: manylinux_2_28_${{ matrix.arch }}
          MANIFEST_PYTHON: py${{ matrix.python }}
          MANIFEST_WHEEL_DIR: repaired
          MANIFEST_PYPROJECT: pyproject.toml
        run: |
          set -euo pipefail
          /opt/python/${{ matrix.python }}/bin/python3 - <<'PY'
          import hashlib, json, os, pathlib, tomllib
          wheel_dir = pathlib.Path(os.environ["MANIFEST_WHEEL_DIR"])
          version = tomllib.load(
              open(os.environ.get("MANIFEST_PYPROJECT", "pyproject.toml"), "rb"),
          )["project"]["version"]
          files = []
          for p in sorted(wheel_dir.glob("*.whl")):
              data = p.read_bytes()
              if not data:
                  raise SystemExit(f"empty wheel: {p}")
              files.append({"name": p.name,
                            "sha256": hashlib.sha256(data).hexdigest(),
                            "size": len(data)})
          if not files:
              raise SystemExit("no wheels to manifest")
          manifest = {
              "artifact": os.environ["MANIFEST_ARTIFACT"],
              "product": os.environ["MANIFEST_PRODUCT"],
              "version": version,
              "product_commit": os.environ["GITHUB_SHA"],
              "engine_sha": os.environ["ENGINE_REV"],
              "highs_version": os.environ["HIGHS_TAG"],
              "platform": os.environ["MANIFEST_PLATFORM"],
              "python": os.environ["MANIFEST_PYTHON"],
              "files": files,
          }
          out = wheel_dir / f"manifest-{manifest['artifact']}.json"
          out.write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pytauargus-manylinux-${{ matrix.arch }}-py${{ matrix.python }}
          path: repaired
          if-no-files-found: error

  build-windows:
    name: windows py${{ matrix.python }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The engine pin is the submodule gitlink in this repo; the checkout
      # above places it at ./tauargus-engine (nested submodules included).
      - name: Read engine pin
        shell: bash
        run: echo "ENGINE_REV=$(git -C tauargus-engine rev-parse HEAD)" >> "$GITHUB_ENV"

      # The HiGHS version is pinned in the engine repo (engine/HiGHS-VERSION),
      # the single source of truth for both the Python and the R builds.
      - name: Read HiGHS pin
        shell: bash
        run: echo "HIGHS_TAG=$(tr -d '[:space:]' < tauargus-engine/engine/HiGHS-VERSION)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build HiGHS from source (cached)
        id: highs
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/highs-prefix"
          if [ -f "$PREFIX/.done" ]; then
            echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone --depth 1 --branch "$HIGHS_TAG" \
            https://github.com/ERGO-Code/HiGHS.git highs
          cmake -S highs -B highs/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build highs/build -j --config Release
          cmake --install highs/build --config Release
          touch "$PREFIX/.done"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Build engine superbuild (cached)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "tauargus-engine/engine/build/.done" ]; then
            echo "engine already built"
            exit 0
          fi
          cmake -S tauargus-engine/engine -B tauargus-engine/engine/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DHighs_DIR="$(dirname "$(find "${{ steps.highs.outputs.prefix }}" -name "[Hh]ighs[Cc]onfig.cmake" -o -name highs-config.cmake | head -n1)")"
          cmake --build tauargus-engine/engine/build -j --config Release
          touch tauargus-engine/engine/build/.done

      - name: Build wheel
        shell: bash
        env:
          TAUARGUS_ENGINE_DIR: ${{ github.workspace }}/tauargus-engine
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "scikit-build-core>=0.10" "pybind11>=2.13"
          python -m pip wheel . --no-deps -w wheelhouse

      - name: Repair wheel (bundle HiGHS + engine DLLs)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install delvewheel
          ENGINE_BIN="$(cygpath -w "$GITHUB_WORKSPACE/tauargus-engine/engine/build/bin/Release")"
          HIGHS_BIN="$(cygpath -w "$RUNNER_TEMP/highs-prefix/bin")"
          delvewheel repair --add-path "$ENGINE_BIN;$HIGHS_BIN" -w repaired wheelhouse/*.whl

      # The old clean-venv smoke test lived here. It is replaced by the
      # install-windows job: a separate fresh-venv job that installs this
      # exact wheel, runs the installed-package tests and executes the
      # .arb job through the public API.

      - name: Write artifact manifest
        shell: bash
        env:
          MANIFEST_ARTIFACT: pytauargus-windows-py${{ matrix.python }}
          MANIFEST_PRODUCT: pytauargus
          MANIFEST_PLATFORM: win_amd64
          MANIFEST_PYTHON: py${{ matrix.python }}
          MANIFEST_WHEEL_DIR: repaired
          MANIFEST_PYPROJECT: pyproject.toml
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, tomllib
          wheel_dir = pathlib.Path(os.environ["MANIFEST_WHEEL_DIR"])
          version = tomllib.load(
              open(os.environ.get("MANIFEST_PYPROJECT", "pyproject.toml"), "rb"),
          )["project"]["version"]
          files = []
          for p in sorted(wheel_dir.glob("*.whl")):
              data = p.read_bytes()
              if not data:
                  raise SystemExit(f"empty wheel: {p}")
              files.append({"name": p.name,
                            "sha256": hashlib.sha256(data).hexdigest(),
                            "size": len(data)})
          if not files:
              raise SystemExit("no wheels to manifest")
          manifest = {
              "artifact": os.environ["MANIFEST_ARTIFACT"],
              "product": os.environ["MANIFEST_PRODUCT"],
              "version": version,
              "product_commit": os.environ["GITHUB_SHA"],
              "engine_sha": os.environ["ENGINE_REV"],
              "highs_version": os.environ["HIGHS_TAG"],
              "platform": os.environ["MANIFEST_PLATFORM"],
              "python": os.environ["MANIFEST_PYTHON"],
              "files": files,
          }
          out = wheel_dir / f"manifest-{manifest['artifact']}.json"
          out.write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pytauargus-windows-py${{ matrix.python }}
          path: repaired
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # pytauargus-tui: pure Python -> one universal wheel (no HiGHS/superbuild).
  # Released in lockstep with pytauargus (same version, same py-v* trigger).
  # ---------------------------------------------------------------------------
  build-tui:
    name: build pytauargus-tui wheel
    runs-on: ubuntu-24.04
    # The TUI wheel is exercised by the install jobs, which install it
    # together with the pytauargus wheel of THIS run (the TUI declares an
    # exact pytauargus==<version> dependency, so a published version can
    # never be substituted).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Explicit ./ so pip builds this repo's package, not the unrelated
          # "tui" distribution on PyPI (pip 26 resolves bare names to the
          # index even when a same-named directory exists).
          python -m pip wheel ./tui --no-deps -w dist
          # Fail fast if the wrong distribution was built.
          ls dist/pytauargus_tui-*.whl

      - name: Show wheel
        run: ls -la dist

      # The old clean-venv smoke test (which resolved the TUI against the
      # linux reference wheel of this run) is replaced by the install
      # jobs, which install the TUI wheel against the pytauargus wheel of
      # this run and exercise both entry points.
      - name: Write artifact manifest
        env:
          MANIFEST_ARTIFACT: pytauargus-tui-wheel
          MANIFEST_PRODUCT: pytauargus-tui
          MANIFEST_PLATFORM: py3-none-any
          MANIFEST_PYTHON: py3
          MANIFEST_WHEEL_DIR: dist
          MANIFEST_PYPROJECT: tui/pyproject.toml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tomllib
          wheel_dir = pathlib.Path(os.environ["MANIFEST_WHEEL_DIR"])
          version = tomllib.load(
              open(os.environ.get("MANIFEST_PYPROJECT", "pyproject.toml"), "rb"),
          )["project"]["version"]
          files = []
          for p in sorted(wheel_dir.glob("*.whl")):
              data = p.read_bytes()
              if not data:
                  raise SystemExit(f"empty wheel: {p}")
              files.append({"name": p.name,
                            "sha256": hashlib.sha256(data).hexdigest(),
                            "size": len(data)})
          if not files:
              raise SystemExit("no wheels to manifest")
          # Pure-Python wheel: the engine provenance comes from the
          # pytauargus wheels (the TUI pins pytauargus==<version>).
          manifest = {
              "artifact": os.environ["MANIFEST_ARTIFACT"],
              "product": os.environ["MANIFEST_PRODUCT"],
              "version": version,
              "product_commit": os.environ["GITHUB_SHA"],
              "engine_sha": None,
              "highs_version": None,
              "platform": os.environ["MANIFEST_PLATFORM"],
              "python": os.environ["MANIFEST_PYTHON"],
              "files": files,
          }
          out = wheel_dir / f"manifest-{manifest['artifact']}.json"
          out.write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pytauargus-tui-wheel
          path: dist
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Installed-distribution tests: fresh environments, no product checkout,
  # no compiler. Each job installs the exact wheels of this run (native +
  # TUI), runs the bundled test resource (existing tests + the portable
  # .arb fixture job with the native protection audit), and checks the TUI
# ---------------------------------------------------------------------------
  # Installed-distribution tests: fresh environments, no product checkout,
  # no compiler. Each job installs the exact wheels of this run (native +
  # TUI), runs the bundled test resource (curated existing tests + the
  # portable .arb fixture job with the native protection audit), checks
  # the TUI entry point and the uvx entry point, and verifies that the
  # loaded package comes from the installation.
  # ---------------------------------------------------------------------------

  test-resource:
    name: assemble install test resource
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the test resource
        run: |
          set -euo pipefail
          # The resource ships the runner, the fixture, the expectations
          # and a curated set of existing tests that exercise the
          # installed package (no source-tree imports, no engine-repo
          # data). The existing tests are copied from this commit so the
          # resource always matches the code the wheels were built from.
          mkdir -p dist-install-tests
          cp -r release-tests/. dist-install-tests/
          rm -rf dist-install-tests/existing
          mkdir -p dist-install-tests/existing
          for f in test_meta test_audit test_result test_arb test_rda \
                   test_micro test_util test_hrc test_dataframe \
                   test_specify_table_cost_defaults; do
            cp "tests/${f}.py" dist-install-tests/existing/
          done
          find dist-install-tests -type f | sort

      - name: Upload test resource
        uses: actions/upload-artifact@v4
        with:
          name: py-install-tests
          path: dist-install-tests
          if-no-files-found: error

  install-linux-x86_64:
    name: install test linux x86_64
    runs-on: ubuntu-24.04
    container:
      # Install on the old glibc runner image, not the manylinux build
      # container: the check is a real install on a current distro with
      # a glibc (2.35) close to the manylinux2028 floor, and the wheel
      # must load without any compiler.
      image: ubuntu:22.04
    needs: [build-linux, build-tui, test-resource]
    env:
      # Strip product dev paths; the installed product must not see them.
      TAUARGUS_ENGINE_DIR:
      PYTHONPATH:
    steps:
      - name: Install system deps (uv needs TLS certs)
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates

      - uses: astral-sh/setup-uv@v5

      - name: Download artifacts (this run)
        uses: actions/download-artifact@v4
        with:
          name: pytauargus-manylinux-x86_64-pycp312-cp312
          path: wheels-native
      - uses: actions/download-artifact@v4
        with:
          name: pytauargus-tui-wheel
          path: wheels-tui
      - uses: actions/download-artifact@v4
        with:
          name: py-install-tests
          path: install-tests

      - name: Fresh venv (path with a space) and install
        shell: bash
        run: |
          set -euo pipefail
          WORK="$HOME/arb install/work"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          uv venv --python 3.12 "$WORK/venv"
          # Explicit local wheels: the TUI's exact pytauargus==<version>
          # dependency is satisfied by the native wheel of this run, so
          # pip can never substitute a published package.
          uv pip install --python "$WORK/venv/bin/python" \
            wheels-native/*.whl wheels-tui/*.whl
          uv pip install --python "$WORK/venv/bin/python" \
            pytest pandas pyarrow
          "$WORK/venv/bin/python" -c "import pytauargus; print('installed ok')"

      - name: Read expectations from the build manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          m = json.load(open(
              "wheels-native/manifest-pytauargus-manylinux-x86_64-pycp312-cp312.json"))
          t = json.load(open("wheels-tui/manifest-pytauargus-tui-wheel.json"))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"TAUARGUS_EXPECTED_ENGINE_SHA={m['engine_sha']}\n")
              f.write(f"TAUARGUS_EXPECTED_HIGHS={m['highs_version']}\n")
              f.write(f"TAUARGUS_EXPECTED_VERSION={m['version']}\n")
              f.write(f"TAUARGUS_EXPECTED_TUI_VERSION={t['version']}\n")
              f.write(f"TAUARGUS_TEST_VENV={os.environ['HOME']}/arb install/work/venv\n")
          PY

      - name: Run the installed-package tests
        shell: bash
        run: |
          set -euo pipefail
          WORK="$HOME/arb install/work"
          cd install-tests
          "$WORK/venv/bin/python" -m pytest . -q -rs

      - name: Test the uvx entry point (local wheels only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uvwheels
          cp wheels-native/*.whl wheels-tui/*.whl uvwheels/
          # Exact version pin: uvx can never resolve a different product
          # version from PyPI; the TUI's native dependency is exact too.
          uvx --find-links uvwheels \
            --from "pytauargus-tui==${TAUARGUS_EXPECTED_TUI_VERSION}" \
            pytauargus-tui --help

