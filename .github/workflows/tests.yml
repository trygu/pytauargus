# Build the pinned engine and run the package test suite on every push and
# PR. (Wheel building and releasing live in wheels.yml and run only on
# py-v* tags.)

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    env:
      TAUARGUS_ENGINE_DIR: ${{ github.workspace }}/tauargus-engine
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The engine pin is the submodule gitlink in this repo; the checkout
      # above places it at ./tauargus-engine (nested submodules included).
      - name: Read engine pin
        run: echo "ENGINE_REV=$(git -C tauargus-engine rev-parse HEAD)" >> "$GITHUB_ENV"

      # The HiGHS version is pinned in the engine repo (engine/HiGHS-VERSION),
      # the single source of truth for both the Python and the R builds.
      - name: Read HiGHS pin
        run: echo "HIGHS_TAG=$(tr -d '[:space:]' < tauargus-engine/engine/HiGHS-VERSION)" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v5

      - name: Cache HiGHS
        id: highs-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/highs-prefix
          key: highs-${{ matrix.os }}-${{ env.HIGHS_TAG }}-static-v3

      - name: Build HiGHS from source
        if: steps.highs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$HIGHS_TAG" https://github.com/ERGO-Code/HiGHS.git highs
          # Linux: static C++ runtime so the dev build matches the wheel
          # (self-contained, no host libstdc++ dependency); the
          # --exclude-libs keep the embedded runtime's symbols local. One
          # -Wl per archive: the GCC driver splits -Wl, lists on commas.
          # (No empty-array expansion: the macOS runner's bash 3.2 dies
          # on it under set -u.)
          if [ "$(uname)" = "Linux" ]; then
            # Version script: export only the HiGHS C API, so HiGHS's own
            # std:: template instantiations stay local (see wheels.yml).
            printf '{ global: Highs_*; local: *; };\n' > highs/highs-export.vers
            cmake -S highs -B highs/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/highs-prefix" \
              -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc -Wl,--exclude-libs,libstdc++.a -Wl,--exclude-libs,libsupc++.a -Wl,--exclude-libs,libgcc.a -Wl,--exclude-libs,libgcc_eh.a -Wl,--version-script=$GITHUB_WORKSPACE/highs/highs-export.vers"
          else
            cmake -S highs -B highs/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/highs-prefix"
          fi
          cmake --build highs/build -j
          cmake --install highs/build

      - name: Build pinned engine
        run: |
          set -euo pipefail
          HIGHS_CFG="$(dirname "$(find "$RUNNER_TEMP/highs-prefix" -name 'highs-config.cmake' -o -name 'highsConfig.cmake' -o -name 'HighsConfig.cmake' | head -n1)")"
          cmake -S tauargus-engine/engine -B tauargus-engine/engine/build \
            -DCMAKE_BUILD_TYPE=Release -DHighs_DIR="$HIGHS_CFG"
          cmake --build tauargus-engine/engine/build -j

      - name: Install package
        run: uv sync --extra test

      - name: Run tests
        # Explicitly target tests/: the workspace also contains the HiGHS
        # source checkout and the pinned engine checkout, both with test
        # files that would otherwise be collected.
        run: uv run pytest tests -q
